plugins {
    id 'com.android.application'
}

android {
    namespace 'org.retzar.android'
    compileSdk 35

    defaultConfig {
        applicationId 'org.retzar.android'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        // One ABI for now: every current phone. The library comes from
        // `cargo ndk` (see ../README.md) into src/main/jniLibs.
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            // Debug-signed so that a release build installs for testing.
            signingConfig signingConfigs.debug
        }
    }
}
